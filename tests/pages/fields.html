<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Input boxes</title>
<!-- 测试页：输入框翻译（连按三次空格）。单行框、多行框、可编辑区域、像 React 那样自己管状态的框、写代码的框、
     像 Slate / Lexical 那样自己记着内容的编辑器 -->
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 30px; }
  textarea, input, [contenteditable] { display: block; width: 520px; margin: 10px 0 18px; font: inherit; padding: 6px 8px;
    border: 1px solid #bbb; border-radius: 6px; }
  textarea { height: 70px; }
  [contenteditable] { min-height: 50px; }
  #me { white-space: pre-wrap; }
  #me p { margin: 0 0 6px; }
</style>
</head>
<body>
<h1>Reply to the thread</h1>
<textarea id="ta"></textarea>
<input id="in" type="text">
<input id="in2" type="text">
<div id="ce" contenteditable="true"></div>
<input id="rx" type="text">
<textarea id="code"></textarea>
<div id="me" contenteditable="true"></div>
<script>
  // 像 React 的受控输入框：只认 input 事件更新自己的状态
  window.rxState = '';
  document.getElementById('rx').addEventListener('input', (e) => { window.rxState = e.target.value; });

  // 像 Slate、Lexical 那样自己记着内容的编辑器：输入都走 beforeinput，改自己记着的段落再重画（一段一个 <p>）；
  // 别人直接改了 DOM，它不知道，下一次输入就按记着的重画回去
  (() => {
    const el = document.getElementById('me');
    const model = (window.meModel = ['']);
    const render = (caret) => {
      el.replaceChildren(...model.map((t) => {
        const p = document.createElement('p');
        p.append(t || document.createElement('br'));
        return p;
      }));
      if (!caret) return;
      const r = document.createRange();
      r.selectNodeContents(el.lastChild);
      r.collapse(false);
      getSelection().removeAllRanges();
      getSelection().addRange(r);
    };
    el.addEventListener('beforeinput', (e) => {
      e.preventDefault();
      const all = !getSelection().isCollapsed;
      const text = e.dataTransfer ? e.dataTransfer.getData('text/plain') : e.data || '';
      if (e.inputType === 'insertParagraph') model.push('');
      else if (e.inputType.startsWith('insert')) {
        const lines = text.split('\n');
        if (all) model.splice(0, model.length, ...lines);
        else {
          model[model.length - 1] += lines[0];
          model.push(...lines.slice(1));
        }
      } else if (e.inputType.startsWith('delete')) {
        if (all) model.splice(0, model.length, '');
        else model[model.length - 1] = model[model.length - 1].slice(0, -1);
      }
      render(true);
    });
    render(false);
  })();
</script>
</body>
</html>
