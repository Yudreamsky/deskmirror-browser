<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeskMirror</title>
<style>
  :root { color-scheme: light dark; --blue: #3d8bfd; --muted: #6b7280; --line: #d6dae1; --bg: #fff; --card: #f7f8fa;
    --ok: #16a34a; --err: #dc2626; --note: #eef5ff; --warn: #b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --muted: #9aa3af; --line: #3a3f47; --bg: #1c1e23; --card: #24272d; --ok: #4ade80; --err: #f87171; --note: #1e2a3d;
      --warn: #fbbf24; }
  }
  body { margin: 0; background: var(--bg); font: 14px/1.6 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; }
  main { max-width: 660px; margin: 32px auto; padding: 0 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  h1 img { width: 28px; height: 28px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  h2 + label, .langs label { margin-top: 0; }
  input, select { width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: inherit; font: inherit; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .row { display: flex; gap: 10px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
  .inline { display: flex; gap: 8px; align-items: center; }
  .inline input { flex: 1 1 auto; min-width: 0; }
  .inline button { flex: none; }
  .langs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; margin-top: 14px; }
  .langs .arrow { padding-bottom: 8px; color: var(--muted); }
  button { padding: 7px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: inherit;
    font: inherit; cursor: pointer; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  #models { margin-top: 6px; }
  .msg { font-size: 13px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .banner { background: var(--note); border: 1px solid var(--blue); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
  .notes { margin: 6px 0 0; padding-left: 20px; }
  #presetNote { color: var(--warn); }
  .chain { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 8px; }
  .eng { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 5px 6px 5px 10px; }
  .chain.many .eng { cursor: pointer; }
  .chain.many .eng:hover { border-color: var(--blue); }
  .chain.many .eng.sel { border-color: var(--blue); box-shadow: inset 3px 0 0 var(--blue); }
  .eng .top { display: flex; align-items: center; gap: 8px; min-height: 24px; }
  .eng .num { font-weight: 700; color: var(--blue); flex: none; }
  .eng .role { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; flex: none; }
  .eng .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eng .mini { padding: 0 7px; font-size: 12px; line-height: 20px; flex: none; }
  .eng .mini.hide { visibility: hidden; }
  .eng .state { display: block; font-size: 12px; margin: 1px 0 2px 22px; color: var(--muted); overflow-wrap: anywhere; }
  .eng .state.ok { color: var(--ok); } .eng .state.err { color: var(--err); } .eng .state.skip { color: var(--warn); }
  .chainBar { display: flex; gap: 8px; flex-wrap: wrap; }
  .editor { margin-top: 14px; border-top: 1px dashed var(--line); }
  .editing { font-size: 13px; color: var(--muted); margin-top: 10px; }
  #unsaved { color: var(--warn); }
  .skins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
  .skin { all: unset; box-sizing: border-box; cursor: pointer; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px;
    background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
  .skin:hover { border-color: var(--blue); }
  .skin.on { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(61, 139, 253, 0.2); }
  .skin .nm { font-weight: 600; text-align: center; font-size: 13px; }
  .pv { position: relative; height: 86px; border-radius: 7px; overflow: hidden;
    background: linear-gradient(135deg, #fde68a, #fca5a5 45%, #93c5fd); }
  .pv::before { content: ''; position: absolute; inset: 10px 14px;
    background: repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.16) 0 4px, transparent 4px 11px); }
  .pv .ln { position: absolute; left: 30px; right: 30px; top: 36px; bottom: 10px; border: 2px solid #3d8bfd;
    background: repeating-linear-gradient(180deg, rgba(30, 64, 175, 0.35) 0 4px, rgba(255, 255, 255, 0.9) 4px 11px); }
  .pv .tb { position: absolute; left: 28px; top: 20px; width: 96px; height: 16px; background: rgba(28, 30, 36, 0.92);
    border-radius: 4px 4px 0 0; }
  .pv-glass .ln { border: 1.5px solid rgba(255, 255, 255, 0.95); border-radius: 10px;
    box-shadow: 0 0 0 1px rgba(61, 139, 253, 0.55), 0 6px 14px rgba(0, 0, 0, 0.15); }
  .pv-glass .tb { top: 14px; height: 16px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.85);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.5));
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: inset 0 1px 1px #fff, 0 4px 10px rgba(0, 0, 0, 0.15); }
  .about div { margin: 4px 0; }
  .about .mini { padding: 1px 8px; font-size: 12px; margin-left: 6px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--blue); width: max-content; }
  .rewardBody { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 10px 0 4px; }
  .rewardBody p { margin: 0; }
  .rewardBody.en .kofi { order: -1; }
  .rewardBody img { width: 300px; height: 300px; border-radius: 8px; }
  a { color: var(--blue); }
  ul { margin: 6px 0 0; padding-left: 20px; }
  kbd { font: 12px monospace; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1><img src="icons/icon48.png" alt=""><span data-t="title"></span></h1>
  <p class="sub" data-t="sub"></p>

  <div class="banner" id="banner" hidden></div>

  <div class="card">
    <h2 data-t="langCard"></h2>
    <label for="native" data-t="native"></label>
    <select id="native"></select>
    <div class="hint" data-t="nativeHint"></div>
    <div class="langs">
      <div>
        <label for="source" data-t="source"></label>
        <select id="source"></select>
      </div>
      <div class="arrow">→</div>
      <div>
        <label for="target" data-t="target"></label>
        <select id="target"></select>
      </div>
    </div>
    <div class="hint" data-t="dirHint"></div>
    <label for="inputTarget" data-t="inputTarget"></label>
    <select id="inputTarget"></select>
    <div class="hint" data-t="inputHint"></div>
  </div>

  <div class="card">
    <h2 data-t="lookCard"></h2>
    <div class="skins">
      <button type="button" class="skin" data-skin="classic"><span class="pv"><i class="ln"></i><i class="tb"></i></span><span class="nm" data-t="skinClassic"></span></button>
      <button type="button" class="skin" data-skin="glass"><span class="pv pv-glass"><i class="ln"></i><i class="tb"></i></span><span class="nm" data-t="skinGlass"></span></button>
    </div>
    <div class="hint" data-t="skinHint"></div>
  </div>

  <div class="card">
    <h2 data-t="service"></h2>
    <div class="hint" data-t="chainHint"></div>
    <div class="chain" id="chain"></div>
    <div class="chainBar">
      <button id="addEngine" type="button" data-t="add"></button>
      <button id="testAll" type="button" data-t="testAll"></button>
    </div>
    <div class="editor">
    <div class="editing" id="editing"></div>
    <label for="preset" data-t="svcLabel"></label>
    <select id="preset"></select>
    <div class="hint" id="presetNote" hidden></div>
    <div class="hint"><a id="site" href="#" target="_blank" rel="noopener" hidden></a></div>
    <div id="fields">
      <label for="baseUrl" data-t="baseUrl"></label>
      <input id="baseUrl" spellcheck="false">
      <div id="keyRow">
        <label for="apiKey" data-t="apiKey"></label>
        <input id="apiKey" type="password" spellcheck="false" autocomplete="off">
        <div class="hint" data-t="keyHint"></div>
      </div>
      <label for="model" data-t="model"></label>
      <div class="inline">
        <input id="model" spellcheck="false">
        <button id="fetch" type="button" data-t="fetch"></button>
      </div>
      <select id="models" hidden></select>
      <div class="msg" id="modelMsg"></div>
    </div>
    </div>
    <div class="row">
      <button class="primary" id="save" data-t="save"></button>
      <button id="test" data-t="test"></button>
      <span class="msg" id="unsaved"></span>
      <span class="msg" id="result"></span>
    </div>
  </div>

  <div class="card">
    <h2 data-t="verCard"></h2>
    <div class="inline">
      <span id="version" style="flex:1"></span>
      <button id="check" type="button" data-t="check"></button>
      <button id="upgrade" type="button" class="primary" hidden></button>
    </div>
    <div class="msg" id="updateMsg"></div>
    <ul class="notes" id="updateNotes" hidden></ul>
  </div>

  <div class="card">
    <h2 data-t="howCard"></h2>
    <ul id="how"></ul>
  </div>

  <div class="card">
    <h2 data-t="aboutCard"></h2>
    <div class="about">
      <div><span data-t="email"></span><a id="mail" href="mailto:a885187@gmail.com">a885187@gmail.com</a><button id="copyMail" type="button" class="mini" data-t="copyMail"></button></div>
      <div><span data-t="desktop"></span><a href="https://github.com/Yudreamsky/deskmirror" target="_blank" rel="noopener">github.com/Yudreamsky/deskmirror</a></div>
    </div>
    <details id="reward">
      <summary data-t="reward"></summary>
      <div class="rewardBody" id="rewardBody">
        <p data-t="thanks"></p>
        <img src="assets/wechat_reward.jpg" alt="">
        <p data-t="scan"></p>
        <p class="hint" data-t="optional"></p>
        <p class="kofi" id="kofi"></p>
      </div>
    </details>
  </div>
</main>
<script src="content/text.js"></script>
<script src="presets.js"></script>
<script src="chain.js"></script>
<script src="llm.js"></script>
<script src="options.js"></script>
</body>
</html>
